# Adds automatic HTTPS on a server with a domain pointed at its public IP.
services:
  proxy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN to your real domain}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
