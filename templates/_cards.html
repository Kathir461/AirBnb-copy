<div class="grid">{% for stay in stays %}<article class="stay-card"><div class="photo-wrap"><a class="stay-photo-link" href="{{ url_for('stay_detail', stay_id=stay.id) }}" aria-label="View {{ stay.title }}"><img src="{{ url_for('static', filename='images/' + stay.image) }}" alt="{{ stay.title }} — illustrative accommodation photo" width="900" height="800" {{ 'loading=lazy' if loop.index > 3 else '' }}></a><span class="badge">{{ stay.badge }}</span>
<form class="heart-form" method="post" action="{{ url_for('save_stay', stay_id=stay.id) }}"><input type="hidden" name="csrf_token" value="{{ session.csrf }}"><input type="hidden" name="action" value="{{ 'remove' if stay.id in saved else 'save' }}"><input type="hidden" name="origin" value="{{ 'wishlist' if request.endpoint == 'wishlist' else 'home' }}"><input type="hidden" name="destination" value="{{ destination|default('') }}"><input type="hidden" name="category" value="{{ category|default('All homes') }}"><button type="submit" class="heart {{ 'saved' if stay.id in saved }}" aria-label="{{ 'Remove ' if stay.id in saved else 'Save ' }}{{ stay.title }}{{ ' from' if stay.id in saved else ' to' }} wishlist" aria-pressed="{{ 'true' if stay.id in saved else 'false' }}">{{ icon('heart') }}</button></form></div>
<div class="card-heading"><h2><a href="{{ url_for('stay_detail', stay_id=stay.id) }}">{{ stay.location }}</a></h2><span class="rating">{{ icon('star') }} {{ stay.rating }}</span></div><p class="stay-title"><a href="{{ url_for('stay_detail', stay_id=stay.id) }}">{{ stay.title }}</a></p><p class="stay-description">{{ stay.description }}</p><p class="price"><strong>₹{{ '{:,}'.format(stay.price) }}</strong> <span>/ night</span></p></article>{% endfor %}</div>
